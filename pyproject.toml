[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-governance"
version = "0.2.0"
description = "Provenance-aware native-geometry marine governance data products"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "folium>=0.20", "geopandas>=1", "numpy>=1.26", "pandas>=2.1",
  "pyarrow>=14", "pydantic>=2", "pyproj>=3.6", "PyYAML>=6", "requests>=2.31", "shapely>=2",
]

[project.optional-dependencies]
test = ["pytest>=8", "h3>=4", "jsonschema>=4.18"]
contract = ["jsonschema>=4.18"]
h3 = ["h3>=4.2"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.6.23", "pymdown-extensions>=10.2,<12.2"]

[project.urls]
Documentation = "https://marinecast.github.io/toolkit-governance/"
Repository = "https://github.com/MarineCast/toolkit-governance"
Issues = "https://github.com/MarineCast/toolkit-governance/issues"

[project.scripts]
governance = "governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governance = ["resources/**/*", "**/*.md", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
