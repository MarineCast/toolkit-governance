schema_version: 1
area: full_area
common_config_path: config/common.yaml

clipping:
  crs: EPSG:4326
  method: antimeridian_safe_shapely_intersection_v1
  tolerance_degrees: 1.0e-9

raw:
  snapshot_root: data/raw/governance

output:
  processed_root: data/processed/domain/governance
  coverage_matrix_path: data/processed/domain/governance/source_coverage_matrix.json

inspection:
  map_path: outputs/domains/governance/governance_layers.html
  map_manifest_path: outputs/domains/governance/governance_layers_map_manifest.json
  presentation_config_path: config/data/presentation_settings.yaml
  simplify_tolerance_meters: 250
  category_colors:
    protected_areas: '#33A02C'
    jurisdiction: '#1F78B4'
    fisheries_management: '#E31A1C'
    vessel_management: '#FF7F00'
    administrative_context: '#6A3D9A'

catalog_path: config/data/governance/feature_catalog.yaml

coverage_regions:
  california:
    label: California
  oregon:
    label: Oregon
  washington:
    label: Washington
  alaska:
    label: Alaska
  british_columbia_canada:
    label: British Columbia and Canada
  us_federal_offshore:
    label: U.S. federal and offshore
  canadian_federal_offshore:
    label: Canadian federal and offshore
  international_boundary:
    label: International boundary

