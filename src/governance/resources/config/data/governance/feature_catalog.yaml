    - shipping_lanes__chs_recommended_centerline__feature_memberships_v1
    - shipping_lanes__chs_recommended_lane_part__feature_memberships_v1
    - shipping_lanes__chs_recommended_track__feature_memberships_v1
    - shipping_lanes__chs_two_way_route_part__feature_memberships_v1
    - shipping_lanes__noaa_fairway__feature_memberships_v1
    - shipping_lanes__noaa_recommended_route__feature_memberships_v1
    - shipping_lanes__noaa_two_way_route__feature_memberships_v1
    - traffic_separation_schemes__chs_lane_part__feature_memberships_v1
    - traffic_separation_schemes__chs_scheme_boundary__feature_memberships_v1
    - traffic_separation_schemes__chs_scheme_crossing__feature_memberships_v1
    - traffic_separation_schemes__chs_separation_line__feature_memberships_v1
    - traffic_separation_schemes__chs_separation_zone__feature_memberships_v1
    - traffic_separation_schemes__noaa_separation_zone__feature_memberships_v1
    - traffic_separation_schemes__noaa_traffic_lane__feature_memberships_v1
    - speed_restriction_zones__feature_memberships_v1
    retained_compatibility_identity_columns:
    - vessel_routing_regulations__shipping_lanes__feature_memberships_v1
    saved_identity_aliases:
      vessel_routing_regulations__shipping_lanes__feature_memberships_v1: vessel_routing_regulations__traffic_separation_zones__feature_memberships_v1
    grouped_identity_components:
      vessel_routing_regulations__shipping_lanes:
      - shipping_lanes__chs_navigation_line
      - shipping_lanes__chs_recommended_centerline
      - shipping_lanes__chs_recommended_lane_part
      - shipping_lanes__chs_recommended_track
      - shipping_lanes__chs_two_way_route_part
      - shipping_lanes__noaa_fairway
      - shipping_lanes__noaa_recommended_route
      - shipping_lanes__noaa_two_way_route
      vessel_routing_regulations__traffic_separation_zones:
      - shipping_lanes__chs_navigation_line
      - shipping_lanes__chs_recommended_centerline
      - shipping_lanes__chs_recommended_lane_part
      - shipping_lanes__chs_recommended_track
      - shipping_lanes__chs_two_way_route_part
      - shipping_lanes__noaa_fairway
      - shipping_lanes__noaa_recommended_route
      - shipping_lanes__noaa_two_way_route
      - traffic_separation_schemes__chs_lane_part
      - traffic_separation_schemes__chs_scheme_boundary
      - traffic_separation_schemes__chs_scheme_crossing
      - traffic_separation_schemes__chs_separation_line
      - traffic_separation_schemes__chs_separation_zone
      - traffic_separation_schemes__noaa_separation_zone
      - traffic_separation_schemes__noaa_traffic_lane
    retained_hidden_support: Original count, area/length and status arrays remain exact;
      no additional measurement options
    interpretation: True means at least one retained routing/regulation reference feature
      is recorded in the native cell. This includes navigation lines, recommended routes,
      traffic-scheme components and seasonal speed references; it does not mean an unconditional
      mandatory restriction, current activation, vessel-specific applicability or legal
      compliance. False requires observed empty memberships for every expected component
      and independently evidenced complete geographic inventory coverage of the full
      supplied cells. Otherwise no-hit support is null (unknown/unavailable), never
      inferred false. Identity layers retain all source-qualified IDs, overlaps, source
      roles, advisory/conditional meanings and original details. Shipping Lanes & Traffic
      Separation Zones groups all eight shipping roles and seven traffic-scheme roles
      for display; navigation/recommended routes, boundaries, crossings, lane parts,
      separation lines, traffic lanes and separation zones retain their native types.
      Line and polygon memberships are combined as evidence of reference presence, never
      as pooled area/length coverage. No source acquisition, geometry overlay or artificial
      daily history is performed.
  marine_conservation_areas:
    display_name: Marine Conservation Areas
    scientific_features:
      marine_conservation_areas__feature_memberships_v1:
        display_name: Marine Conservation Area Assignment
      marine_conservation_areas__recorded_feature_count:
        display_name: Marine Conservation Area Count
      marine_conservation_areas__recorded_polygon_union_area_fraction:
        display_name: Marine Conservation Area Coverage
        display_unit: '%'
        display_scale: 100
    source_collections:
    - marine_protected_areas
    - conservation_designations
    - wildlife_refuges
    - national_marine_sanctuaries
  proposed_interim_conservation_references:
    display_name: Proposed / Interim Conservation References
    excluded_from_conservation_totals: true
retired_collections:
  ports:
    owner: toolkit-human
    reason: Physical infrastructure points owned by toolkit-human; original source lineage retained
