    source_as_of: Current service inventory at page receipt; geometry vintage and legal
      effective dates unavailable. Historical 2019 LAR references do not establish this
      service vintage.
    license: Public information subject to BIA source use limitations; complete provider
      metadata retained
    attribution: Bureau of Indian Affairs, Office of Trust Services, Division of Land
      Titles and Records, Branch of Geospatial Support
    legal_citation: Provider administrative reference only; no controlling legal determination
    redistribution: Illustrative/reference/statistical purposes only; not legal, survey,
      engineering or navigation use. Acquire directly from BIA and preserve metadata;
      no jurisdiction or ownership inference; local release only.
    authority_scope: Exact application-grid selected land-area inventory. CLASSIFICATION
      source codes retained without unsupported decoding. Includes source-specific reservation/trust/restricted/mixed
      concepts; no claim to represent all tribal interests, traditional territory, sovereignty
      or fishing entitlement.
    source_status: available_after_download
    server_filter: true
    page_size: 5
    source_limitation: Exact application-grid selected land-area inventory. CLASSIFICATION
      source codes retained without unsupported decoding. Includes source-specific reservation/trust/restricted/mixed
