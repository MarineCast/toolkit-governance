site_name: Governance Toolkit
site_description: H3 metric Parquets, original source shapes, and update provenance
site_url: https://marinecast.github.io/toolkit-governance/
repo_url: https://github.com/MarineCast/toolkit-governance
repo_name: MarineCast/toolkit-governance
edit_uri: edit/main/docs/
copyright: Apache-2.0 · MarineCast contributors
theme:
  name: material
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Quickstart: how-to-use.md
  - Families:
      - Overview: layers.md
      - "Administrative Boundaries": families/administrative-boundaries.md
      - "Coast Guard Sectors": families/coast-guard-sectors.md
      - "Critical Habitat": families/critical-habitat.md
      - "Exclusion Zones": families/exclusion-zones.md
      - "Fisheries Management Areas": families/fisheries-management-areas.md
      - "Marine Conservation Areas": families/marine-conservation-areas.md
      - "Vessel Routing & Regulations": families/vessel-routing-regulations.md
  - Product contract: parquet-products.md
  - Coverage and refresh: coverage.md
  - Configuration: configuration.md
  - Reference:
      - CLI and Python API: reference/cli.md
      - Physical columns: reference/columns.md
      - Sources and rights: reference/sources.md
      - Contract invariants: CONTRACTS.md
  - Development:
      - Verification: WORKFLOWS.md
      - Architecture: ARCHITECTURE.md
      - Documentation site: documentation-site.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
